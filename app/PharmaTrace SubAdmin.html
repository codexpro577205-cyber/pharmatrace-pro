<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PharmaTrace Pro - SubAdmin</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f6f9;--card:#ffffff;--ink:#0f172a;--muted:#6b7787;--line:#e6eaf1;
  --brand:#0d9488;--brand-2:#0f766e;--brand-soft:#e6f6f4;
  --danger:#dc2626;--danger-soft:#fee2e2;--warn:#c2410c;--warn-soft:#ffedd5;
  --ok:#047857;--ok-soft:#d1fae5;--shadow:0 1px 2px rgba(15,23,42,.05),0 10px 30px -18px rgba(15,23,42,.35);
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--brand-2)}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1220px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:180px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;box-shadow:0 4px 12px -4px rgba(13,148,136,.7)}
.brand strong{display:block;font-size:15px;line-height:1.1}
.brand small{color:var(--muted);font-size:11.5px;display:block}
nav#nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav#nav button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:9px;font:inherit;font-weight:550;cursor:pointer}
nav#nav button:hover{background:#f1f5f9;color:var(--ink)}
nav#nav button.active{background:var(--brand-soft);color:var(--brand-2)}
/* layout */
.wrap{max-width:1220px;margin:0 auto;padding:18px 16px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
.page-head h2{font-size:20px}
.muted{color:var(--muted)}
.small{font-size:12px}
.center{text-align:center}
.right{text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
.stat .val{font-size:20px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
/* tables */
table.tbl{width:100%;border-collapse:collapse}
table.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
table.tbl td{padding:9px 10px;border-bottom:1px solid #f1f4f8;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:#fafbfd}
.tbl-wrap{overflow-x:auto}
/* forms */
.in,select.in,textarea.in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink);outline:none}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(13,148,136,.13)}
.in.sm{padding:5px 8px;border-radius:7px;font-size:13px}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.btn{border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;background:var(--brand);color:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f8fafc}
.btn.danger{background:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* badges */
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:650;border:1px solid transparent;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.muted{background:#f1f5f9;color:var(--muted)}
.badge.brand{background:var(--brand-soft);color:var(--brand-2)}
/* pos */
.pos{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;align-items:start}
@media(max-width:940px){.pos{grid-template-columns:1fr}}
.results{margin-top:10px;max-height:52vh;overflow:auto}
.res{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;background:#fff}
.res:hover{border-color:var(--brand);background:#f7fdfc}
.res .nm{font-weight:600}
.res .meta{font-size:11.5px;color:var(--muted)}
.totbox{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.totline{display:flex;justify-content:space-between;padding:3px 0}
.totline.grand{font-size:17px;font-weight:750;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
/* modal */
#modal-root.open{display:block}
#modal-root{display:none;position:fixed;inset:0;z-index:80}
.backdrop{position:absolute;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:#fff;border-radius:16px;max-width:620px;width:100%;box-shadow:0 30px 80px -20px rgba(15,23,42,.5);max-height:90vh;display:flex;flex-direction:column}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-body{padding:16px 18px;overflow:auto}
.x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.tmsg{background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:550;box-shadow:0 12px 30px -10px rgba(15,23,42,.6);animation:pop .18s ease-out}
.tmsg.err{background:#b91c1c}.tmsg.warn{background:#b45309}.tmsg.ok{background:#047857}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* misc */
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.active{background:var(--brand-soft);border-color:#bde9e3;color:var(--brand-2)}
.hint{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:12.5px}
#print-area{display:none}
/* receipt */
.rcpt{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-width:320px;margin:0 auto;color:#000}
.rcpt h3{text-align:center;margin:0 0 2px;font-size:15px;font-family:inherit}
.rcpt .c{text-align:center}
.rcpt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.rcpt table{width:100%;border-collapse:collapse;font-size:12px}
.rcpt td{padding:1px 0;vertical-align:top}
.rcpt .r{text-align:right}
@media print{
  body{background:#fff}
  .topbar,nav#nav,#app,#toast,#modal-root{display:none!important}
  #print-area{display:block!important}
  .rcpt{max-width:none;width:80mm}
}
.qtybox{display:flex;gap:4px;align-items:center}
.qtybox .in{width:54px;text-align:center;padding:5px 4px}
.lnk{background:none;border:0;color:#0d9488;font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.lnk:hover{color:#0f766e}

.chat-log{max-height:54vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px}
.msg{max-width:84%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:#f1f5f9;border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:5px}
.msg code{font-size:12px;color:var(--ink)}
nav#nav button[data-route="assistant"]{color:var(--brand-2);font-weight:700}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0f766e,#0d9488 55%,#0f172a)}
.authcard{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:400px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.authlogo{width:52px;height:52px;border-radius:14px;background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px;margin-bottom:12px}
.authcard h2{margin:0 0 4px;font-size:20px}
.authcard p{margin:0 0 16px;font-size:13px}
.err{color:#b91c1c;font-size:12.5px;min-height:16px;margin:6px 0 10px;font-weight:600}
.userchip{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px}
.userchip .who{text-align:right;line-height:1.15}
.userchip .who b{display:block;font-size:12.5px}
.userchip .who span{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.pill.owner{background:#ecfdf5;color:#047857}
.pill.subadmin{background:#eff6ff;color:#1d4ed8}
.pill.sales{background:#fff7ed;color:#c2410c}
.admin-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.admin-tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.admin-tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.panel-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--brand-soft);color:var(--brand-2);font-size:10.5px;font-weight:800;font-style:normal;vertical-align:middle;letter-spacing:.03em}
</style>
</head>
<body>
<header class="topbar">
  <div class="bar">
    <div class="brand">
      <span class="logo">P</span>
      <div><strong>PharmaTrace Pro</strong><em class="panel-tag">SubAdmin</em><small id="shopName">Pharmacy Manager</small></div>
    </div>
    <nav id="nav">
      <button data-route="dashboard">Dashboard</button>
      <button data-route="sales">New Sale</button>
      <button data-route="mysales">My Sales</button>
      <button data-route="inventory">Inventory</button>
      <button data-route="assistant">Assistant</button>
    </nav>
    <div class="userchip" id="userchip"></div>
  </div>
</header>

<main id="app"></main>
<div id="print-area"></div>
<div id="toast"></div>
<div id="modal-root"></div>

<script>
/* =========================================================
   PharmaTrace Pro - offline pharmacy manager (single file)
   All data is stored in this browser's localStorage.
   ========================================================= */

/* ---------- tiny helpers ---------- */
var $ = function(s,r){return (r||document).querySelector(s)};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function pad(n){return String(n).padStart(2,'0')}
function localDate(d){var x=new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())}
function fmtDate(iso){if(!iso)return '-';var d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()}
function fmtDT(iso){if(!iso)return '-';var d=new Date(iso);return fmtDate(iso)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function money(v){
  var n=num(v);
  var s=n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (DB.settings.currency||'')+' '+s;
}
function toast(msg,kind){
  var box=$('#toast');
  var el=document.createElement('div');
  el.className='tmsg '+(kind||'');
  el.textContent=msg;
  box.appendChild(el);
  setTimeout(function(){el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(function(){el.remove()},320)},2600);
}

/* ---------- storage ---------- */
var DB_KEY='pharmatrace_pro_v1';
function blankDB(){
  return {
    settings:{
      shopName:'My Pharmacy', licenseNo:'', address:'', phone:'',
      currency:'PKR', taxPercent:0, expiryWarnDays:90,
      receiptNote:'Thank you. Get well soon!', lowStockWarn:true,
      defaultMargin:15, taxOnProfit:0.5
    },
    medicines:[], batches:[], sales:[], purchases:[],
    suppliers:[], customers:[],
    users:[], audit:[],
    counters:{invoice:1}
  };
}
function loadDB(){
  try{
    var raw=localStorage.getItem(DB_KEY);
    if(!raw) return blankDB();
    var d=JSON.parse(raw), b=blankDB();
    d.medicines=(d.medicines||[]).map(function(m){
      m.packSize=Math.floor(num(m.packSize))||1;
      m.packName=m.packName||'Pack';
      m.unit=m.unit||'Unit';
      if(m.margin==null) m.margin=null;
      return m;
    });
    d.users=d.users||[];
    d.audit=d.audit||[];
    return Object.assign(b,d,{
      settings:Object.assign(b.settings,d.settings||{}),
      counters:Object.assign(b.counters,d.counters||{})
    });
  }catch(e){ console.warn('load failed',e); return blankDB(); }
}
var DB=loadDB();
function persist(){
  try{ localStorage.setItem(DB_KEY,JSON.stringify(DB)); }
  catch(e){ toast('Could not save: browser storage is full or blocked','err'); }
}

/* =========================================================
   SECURITY / ROLES
   ========================================================= */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a))}
  var mp=Math.pow, maxWord=mp(2,32), result='', words=[], asciiBitLength=ascii.length*8;
  var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], primeCounter=k.length;
  var isComposite={};
  for(var candidate=2; primeCounter<64; candidate++){
    if(!isComposite[candidate]){
      for(var i=0;i<313;i+=candidate) isComposite[i]=candidate;
      hash[primeCounter]=(mp(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mp(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){
    var j=ascii.charCodeAt(i);
    if(j>>8) return '';
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10))|0));
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(i=0;i<8;i++){
    for(j=3;j+1;j--){
      var b=(hash[i]>>(j*8))&255;
      result+=((b<16)?'0':'')+b.toString(16);
    }
  }
  return result;
}
function newSalt(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36) }
function hashPass(pass,salt){ return sha256(String(salt)+'::'+String(pass)) }

var session=null;
function currentUser(){ return session ? DB.users.filter(function(u){return u.id===session.userId})[0] : null }
function roleLabel(r){ return r==='owner'?'Main Admin' : r==='subadmin'?'Sub Admin' : r==='sales'?'Sales' : r }
var PANEL={role:'subadmin',name:'SubAdmin'};
var PERMS={
  sale:['owner','subadmin','sales'],
  dashboard:['owner','subadmin','sales'],
  sales:['owner','subadmin','sales'],
  mysales:['owner','subadmin','sales'],
  inventory:['owner','subadmin'],
  stockIn:['owner','subadmin'],
  fullInventory:['owner'],
  purchases:['owner'],
  parties:['owner'],
  reports:['owner'],
  settings:['owner'],
  admin:['owner'],
  assistant:['owner','subadmin','sales']
};
function can(what){
  var u=currentUser(); if(!u) return false;
  var list=PERMS[what]; if(!list) list=PERMS.admin;
  return list.indexOf(u.role)>=0;
}
function logEvent(action,detail){
  var u=currentUser();
  DB.audit.push({id:uid(),at:new Date().toISOString(),userId:u?u.id:'',userName:u?u.name:'System',role:u?u.role:'',action:action,detail:detail||''});
  if(DB.audit.length>3000) DB.audit=DB.audit.slice(-3000);
}
function doLogin(empId,pass){
  var key=String(empId||'').trim().toLowerCase();
  var u=DB.users.filter(function(x){return String(x.empId).toLowerCase()===key})[0];
  if(!u) return 'Employee ID nahi mila';
  if(!u.active) return 'Ye account band hai — main admin se rabta karo';
  if(hashPass(pass,u.salt)!==u.hash) return 'Password ghalat hai';
  if(PANEL.role && u.role!==PANEL.role) return 'Ye '+PANEL.name+' panel hai - aap ka account is panel ke liye nahi hai.';
  session={userId:u.id,role:u.role,name:u.name,empId:u.empId};
  u.lastLogin=new Date().toISOString();
  logEvent('login','Login: '+u.name+' ('+roleLabel(u.role)+')');
  persist();
  route = (u.role==='sales') ? 'sales' : 'dashboard';
  render();
  return null;
}
function doLogout(){
  logEvent('logout','Logout');
  persist();
  session=null; route='dashboard'; chat=[];
  render();
}
function renderSetup(){
  if(PANEL.role!=='owner'){ $('#app').innerHTML='<div class="authwrap"><div class="authcard"><div class="authlogo">P</div><h2>Setup baqi hai</h2><p class="muted">Pehle <b>PharmaTrace Admin</b> panel khol kar main admin account banao, phir ye panel chalega.</p></div></div>'; return; }
  var nav=$('#nav'); if(nav) nav.style.display='none';
  var uc=$('#userchip'); if(uc) uc.innerHTML='';
  $('#app').innerHTML='<div class="authwrap"><div class="authcard">'+
    '<div class="authlogo">P</div><h2>PharmaTrace Pro</h2>'+
    '<p class="muted">Pehli dafa setup — main admin (malik) ka account banao. Ye password sirf aap ke paas ho.</p>'+
    '<form id="setup-form">'+
      '<label class="fld"><span>Dukaan ka naam</span><input class="in" name="shopName" required value="My Pharmacy"></label>'+
      '<label class="fld"><span>Aap ka naam</span><input class="in" name="name" required placeholder="Malik ka naam"></label>'+
      '<label class="fld"><span>Employee ID</span><input class="in" name="empId" required value="admin"></label>'+
      '<label class="fld"><span>Password (kam az kam 4 harf)</span><input class="in" name="pass" type="password" required minlength="4"></label>'+
      '<label class="fld"><span>Dobara password</span><input class="in" name="pass2" type="password" required minlength="4"></label>'+
      '<div class="err" id="setup-err"></div>'+
      '<button class="btn" style="width:100%" type="submit">Account banao aur shuru karo</button>'+
    '</form></div></div>';
  $('#setup-form').onsubmit=function(e){
    e.preventDefault();
    var f=e.target, d={}; new FormData(f).forEach(function(v,k){d[k]=v});
    var errEl=$('#setup-err');
    if(String(d.pass).length<4){ errEl.textContent='Password kam az kam 4 harf ka ho'; return; }
    if(d.pass!==d.pass2){ errEl.textContent='Dono password ek jaise nahi hain'; return; }
    var salt=newSalt();
    var u={id:uid(),empId:String(d.empId).trim()||'admin',name:String(d.name).trim(),role:'owner',
      salt:salt,hash:hashPass(d.pass,salt),active:true,createdAt:new Date().toISOString(),lastLogin:null};
    DB.users.push(u);
    DB.settings.shopName=String(d.shopName).trim()||'My Pharmacy';
    session={userId:u.id,role:'owner',name:u.name,empId:u.empId};
    logEvent('setup','Main admin account banaya: '+u.name);
    persist(); route='dashboard'; render();

/* ---------- domain helpers ---------- */
function medById(id){ return DB.medicines.find(function(m){return m.id===id}) }
function medMargin(m){ var mg=num(m&&m.margin); return mg>0?mg:(num(DB.settings.defaultMargin)||15) }
function medCost(m){ var pr=num(m&&m.price); return Math.round(pr*(1-medMargin(m)/100)*100)/100 }
function medProfit(m){ return Math.round((num(m&&m.price)-medCost(m))*100)/100 }
function roleTag(r){ return '<span class="pill '+esc(r)+'">'+esc(roleLabel(r))+'</span>' }
function stockOf(medId){
  return DB.batches.filter(function(b){return b.medId===medId})
    .reduce(function(t,b){return t+num(b.qty)},0);
}
function packSizeOf(m){ var ps=Math.floor(num(m&&m.packSize)); return ps>1?ps:1 }
function unitName(m){ return (m&&m.unit)||'unit' }
function packName(m){ return (m&&m.packName)||'pack' }
function trimNum(n){ n=Math.round(num(n)*100)/100; return String(n) }
/* shows base units as packs + loose units, e.g. "2 Strip + 3 Tablet" */
function fmtQty(m,units){
  units=num(units);
  var ps=packSizeOf(m), u=unitName(m);
  if(ps<=1) return trimNum(units)+' '+u;
  var p=Math.floor(units/ps), r=Math.round((units-p*ps)*100)/100, out=[];
  if(p>0) out.push(p+' '+packName(m));
  if(r>0) out.push(trimNum(r)+' '+u);
  if(!out.length) out.push('0 '+u);
  return out.join(' + ');
}
function packHint(m){
  var ps=packSizeOf(m);
  if(ps<=1) return 'Sold as 1 '+unitName(m);
  return '1 '+packName(m)+' = '+ps+' '+unitName(m);
}
/* money charged for N base units: whole packs use the pack price when one is set */
function lineAmount(m,units){
  units=num(units);
  var ps=packSizeOf(m), pp=num(m&&m.packPrice), up=num(m&&m.price);
  if(ps>1 && pp>0){
    var packs=Math.floor(units/ps), rem=Math.round((units-packs*ps)*100)/100;
    return packs*pp + rem*up;
  }
  return units*up;
}
function effUnitPrice(m,units){
  units=num(units);
  if(units<=0) return num(m&&m.price);
  return Math.round(lineAmount(m,units)/units*100)/100;
}
function expiryInfo(exp){
  if(!exp) return {cls:'muted',text:'-',days:null};
  var p=String(exp).split('-'), y=+p[0], m=+p[1];
  if(!y||!m) return {cls:'muted',text:'-',days:null};
  var end=new Date(y,m,0,23,59,59);
  var days=Math.round((end-Date.now())/86400000);
  var warn=num(DB.settings.expiryWarnDays)||90;
  if(days<0) return {cls:'danger',text:'Expired',days:days};
  if(days<=warn) return {cls:'warn',text:days+' d left',days:days};
  return {cls:'ok',text:days+' d',days:days};
}
function monthLabel(exp){
  if(!exp) return '-';
  var p=String(exp).split('-');
  return (p[1]||'')+'/'+(p[0]||'');
}
function nextInvoiceNo(){ return 'INV-'+String(num(DB.counters.invoice)||1).padStart(5,'0') }
function saleProfit(s){
  var gross=s.items.reduce(function(t,i){
    var amt=(i.amount!=null?num(i.amount):num(i.qty)*num(i.price));
    return t+amt-num(i.qty)*num(i.cost);
  },0)-num(s.discount);
  return Math.round((gross-profitTax(gross))*100)/100;
}
function saleGrossProfit(s){
  return s.items.reduce(function(t,i){
    var amt=(i.amount!=null?num(i.amount):num(i.qty)*num(i.price));
    return t+amt-num(i.qty)*num(i.cost);
  },0)-num(s.discount);
}
function profitTax(g){ return Math.round(num(g)*num(DB.settings.taxOnProfit||0.5))/100 }
function stockStatus(m){
  var st=stockOf(m.id), re=num(m.reorderLevel);
  if(st<=0) return {cls:'danger',text:'Out of stock'};
  if(re>0 && st<=re) return {cls:'warn',text:'Low stock'};
  return {cls:'ok',text:'In stock'};
}

function addToCart(medId){

  if(line) line.units=Math.min(want,st);
  else cart.push({medId:medId,name:m.name,generic:m.generic||'',units:1});
  renderCart();
}
function cartSubtotal(){ return cart.reduce(function(t,c){ var m=medById(c.medId); return t+lineAmount(m,c.units) },0) }

}

  }).join('');
  wrap.innerHTML='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th>Qty</th><th class="right">Rate</th><th class="right">Amount</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  var setQty=function(i,v){

function completeSale(){
  if(!can('sale')){ toast('Aap ko sale ki ijazat nahi','err'); return; }
  if(!cart.length){ toast('Cart is empty','warn'); return; }
  for(var i=0;i<cart.length;i++){
    if(num(cart[i].units)>stockOf(cart[i].medId)){ toast('Not enough stock for '+cart[i].name,'err'); return; }
  }
  var items=[];
  cart.forEach(function(it){
    var m=medById(it.medId)||{};
    var need=num(it.units);
    var total=lineAmount(m,need);
    var perUnit=need>0? total/need : num(m.price);
    var unitCost=medCost(m);
    var batches=DB.batches.filter(function(b){return b.medId===it.medId && num(b.qty)>0})
      .sort(function(a,b){return String(a.expiry||'9999-99').localeCompare(String(b.expiry||'9999-99'))});
    batches.forEach(function(b){
      if(need<=0) return;
      var take=Math.min(need,num(b.qty));
      b.qty=num(b.qty)-take; need-=take;
      items.push({medId:it.medId,name:it.name,batchId:b.id,batchNo:b.batchNo||'',expiry:b.expiry||'',
        qty:take,price:perUnit,amount:Math.round(take*perUnit*100)/100,cost:unitCost,
        unit:unitName(m),packSize:packSizeOf(m),packName:packName(m)});
    });
    if(need>0){
      items.push({medId:it.medId,name:it.name,batchId:'',batchNo:'',expiry:'',
        qty:need,price:perUnit,amount:Math.round(need*perUnit*100)/100,cost:unitCost,
        unit:unitName(m),packSize:packSizeOf(m),packName:packName(m)});
    }
  });
  var t=cartTotals();
  var u=currentUser();
  var sale={
    id:uid(), invoiceNo:nextInvoiceNo(), date:new Date().toISOString(),
    userId:u.id, userName:u.name, role:u.role,
    customerName:posCustomer.trim(), payment:posPay,
    items:items, subtotal:t.sub, discount:t.disc, tax:t.tax, total:t.total
  };
  DB.sales.push(sale);
  DB.counters.invoice=num(DB.counters.invoice)+1;
  logEvent('sale','Bill '+sale.invoiceNo+' · '+money(sale.total)+' · '+items.length+' line(s)');
  persist();
  cart=[]; posDiscount=0; posCustomer='';
  showReceipt(sale.id,true);
  render();
}

  var h='<div class="rcpt">';
  h+='<h3>'+esc(st.shopName||'Pharmacy')+'</h3>';
  if(st.address) h+='<div class="c">'+esc(st.address)+'</div>';

      '</div><div class="small muted" id="stk-qhint"></div></label>'+

    '<button class="btn ghost" type="button" data-close>Cancel</button></div></form>';
  modal('Stock in',html,function(root){
    var f=root.querySelector('#stk-form');
    var sel=f.querySelector('[name=medId]'), mode=f.querySelector('[name=qtyMode]'),
        qty=f.querySelector('[name=qty]'), price=f.querySelector('[name=price]'),
        box=root.querySelector('#new-med-box'), qh=root.querySelector('#stk-qhint'),
        hint=root.querySelector('#stk-hint');
    function sync(){
      var isNew=sel.value==='__new';
      box.style.display=isNew?'block':'none';
      var m=isNew?null:medById(sel.value);
      var ps=isNew?Math.max(1,Math.floor(num(f.querySelector('[name=newPackSize]').value))||1):packSizeOf(m);
      var un=isNew?(f.querySelector('[name=newUnit]').value||'unit'):unitName(m);
      var pn=isNew?(f.querySelector('[name=newPackName]').value||'pack'):packName(m);
      root.querySelector('#stk-uo').textContent=un;
      root.querySelector('#stk-po').textContent=pn;
      root.querySelector('#stk-po').disabled=(ps<=1);
      if(ps<=1 && mode.value==='pack') mode.value='unit';
      if(m){ price.value=num(m.price); price.disabled=!full; }
      else { price.disabled=false; }
      var q=Math.floor(num(qty.value));
      qh.textContent = q>0 ? '= '+fmtQty({unit:un,packSize:ps,packName:pn}, mode.value==='pack'? q*ps : q) : '';
    }
    sel.addEventListener('change',sync); mode.addEventListener('change',sync);
    qty.addEventListener('input',sync); price.addEventListener('input',sync);
    f.querySelector('[name=newPackSize]').addEventListener('input',sync);
    f.querySelector('[name=newUnit]').addEventListener('input',sync);
    f.querySelector('[name=newPackName]').addEventListener('input',sync);
    sync();
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var d={}; new FormData(f).forEach(function(v,k){d[k]=v});
      var isNew=d.medId==='__new';
      var mid=d.medId, m=null;
      if(isNew){
        if(!String(d.newName||'').trim()){ toast('Medicine ka naam likho','err'); return; }
        if(!(num(d.price)>0)){ toast('Retail price likho','err'); return; }
        m={id:uid(),name:String(d.newName).trim(),generic:'',company:String(d.newCompany||'').trim(),
          category:String(d.newCategory||'Tablet').trim(),unit:String(d.newUnit||'Tablet').trim(),
          packName:String(d.newPackName||'Strip').trim(),
          packSize:Math.max(1,Math.floor(num(d.newPackSize))||1),
          price:num(d.price),packPrice:0,margin:null,barcode:'',
          reorderLevel:0,createdAt:new Date().toISOString(),createdBy:(currentUser()||{}).name||''};
        DB.medicines.push(m); mid=m.id;
      } else {
        m=medById(mid);
        if(!m){ toast('Medicine nahi mili','err'); return; }
      }
      var ps=packSizeOf(m);
      var raw=Math.floor(num(d.qty));
      var units=(d.qtyMode==='pack')? raw*ps : raw;
      if(!d.expiry){ toast('Expiry month zaroori hai','err'); return; }
      if(units<=0){ toast('Quantity 0 se zyada ho','err'); return; }
      var cost = full && num(d.cost)>0 ? (d.qtyMode==='pack'? num(d.cost)/ps : num(d.cost)) : medCost(m);
      DB.batches.push({id:uid(),medId:mid,batchNo:String(d.batchNo||'').trim(),expiry:d.expiry,
        qty:units,cost:cost,addedAt:new Date().toISOString(),addedBy:(currentUser()||{}).name||''});
      logEvent('stock-in',(m.name)+' +'+fmtQty(m,units)+' (batch '+(d.batchNo||'-')+')');
      persist(); closeModal(); render();
      toast(fmtQty(m,units)+' of '+m.name+' add ho gaya','ok');
    });
  },true);
}

      medId:d.medId,medName:m.name,batchNo:(d.batchNo||'').trim(),expiry:d.expiry,
      qty:qty,qtyMode:d.qtyMode,packQty:raw,cost:cost,total:Math.round(qty*cost*100)/100
    });

  });
  $('#btn-backup').onclick=function(){
    var blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    var a=document.createElement('a');
    var stamp=localDate(new Date());
    a.href=URL.createObjectURL(blob);
    a.download='pharmatrace-backup-'+stamp+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
    toast('Backup downloaded','ok');
  };
  $('#btn-restore').onclick=function(){ $('#file-restore').click() };
  $('#file-restore').onchange=function(e){
    var file=e.target.files[0]; if(!file) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var d=JSON.parse(fr.result);
        if(!d || !Array.isArray(d.medicines)) throw new Error('bad file');
        if(!confirm('Replace all current data with this backup?')) return;
        DB=Object.assign(blankDB(),d,{settings:Object.assign(blankDB().settings,d.settings||{})});
        persist(); render(); toast('Backup restored','ok');
      }catch(err){ toast('That file is not a valid PharmaTrace backup','err'); }
    };
    fr.readAsText(file);
  };
  $('#btn-demo').onclick=function(){
    if(DB.medicines.length && !confirm('Add demo medicines on top of your current data?')) return;
    seedDemo(); render(); toast('Demo data loaded','ok');
  };
  $('#btn-reset').onclick=function(){
    if(!confirm('This deletes ALL medicines, stock, sales and purchases on this device. Continue?')) return;
    if(!confirm('Really erase everything? This cannot be undone.')) return;
    DB=blankDB(); persist(); render(); toast('All data erased');
  };
}

var STOP={ki:1,ka:1,ke:1,ko:1,se:1,me:1,mein:1,hai:1,ha:1,hain:1,kya:1,ky:1,kaise:1,kaisay:1,karna:1,karo:1,kar:1,karay:1,karun:1,aur:1,ya:1,par:1,pe:1,ho:1,koi:1,the:1,is:1,it:1,to:1,of:1,for:1,how:1,do:1,a:1,an:1,mujhe:1,mujhay:1,batao:1,bata:1,plz:1,please:1,app:1,ab:1,ap:1,main:1,mera:1,meri:1,kuch:1,sakta:1,sakte:1,sakti:1,kro:1,chahiye:1,chahta:1};
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim() }
function toks(s){ return norm(s).split(' ').filter(function(t){return t.length>1 && !STOP[t]}) }
function esc2(s){ return esc(s) }
function fmtAnswer(txt){
  var s=esc(String(txt));
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/`(.+?)`/g,'<code style="background:#e2e8f0;padding:1px 4px;border-radius:4px">$1</code>');
  return s.replace(/\n/g,'<br>');
}
function salesBetween(from,to){
  return DB.sales.filter(function(s){ var d=localDate(s.date); return d>=from && d<=to });
}
function findMeds(q,limit){
  var t=toks(q); if(!t.length) return [];
  return DB.medicines.map(function(m){
    var hay=norm([m.name,m.generic,m.company,String(m.barcode||'')].join(' '));
    var s=0;
    t.forEach(function(x){ if(hay.indexOf(x)>=0) s+=(x.length>3?3:2) });
    return {m:m,s:s};
  }).filter(function(x){return x.s>0}).sort(function(a,b){return b.s-a.s}).slice(0,limit||3).map(function(x){return x.m});
}
function medLine(m){
  var st=stockOf(m.id);
  var bs=DB.batches.filter(function(b){return b.medId===m.id && num(b.qty)>0})
    .sort(function(a,b){return String(a.expiry||'9999').localeCompare(String(b.expiry||'9999'))});
  var out='**'+m.name+'**';
  if(m.generic||m.company) out+=' ('+[m.generic,m.company].filter(Boolean).join(' · ')+')';
  out+='\nStock: **'+fmtQty(m,st)+'**';
  if(packSizeOf(m)>1) out+='  ·  '+st+' '+unitName(m);
  out+='\nRate: '+money(m.price)+' / '+unitName(m)+(num(m.packPrice)>0?'  ·  '+money(m.packPrice)+' / '+packName(m):'');
  if(can('fullInventory')) out+='\nCost: '+money(medCost(m))+'  ·  margin '+medMargin(m)+'%';
  if(bs.length) out+='\nNearest expiry: '+monthLabel(bs[0].expiry)+' (batch '+(bs[0].batchNo||'-')+')';
  else out+='\nKoi batch stock mein nahi hai.';
  return out;
}
function money0(v){ return money(Math.round(num(v)*100)/100) }

function assistantReply(raw){
  var t=norm(raw), T=toks(raw);
  if(!raw || !raw.trim()) return {text:'Kuch likho to sahi :)'};

  /* ---- greetings ---- */
  if(/^(hi|hello|hey|salam|assalam|asalam|aoa|assalamualaikum|hy)\b/.test(t) || t==='hi')
    return {text:'Assalam-o-Alaikum! Main aap ka offline assistant hoon — stock, sale, report ya software ke baare mein kuch bhi poocho.'};

  /* ---- help ---- */
  if(/\bhelp\b|\bcommands?\b|\bkya kar sakta\b|\bkya kar sakte\b|\bmadad\b/.test(t))
    return {text:'Main ye sab kar sakta hoon (sab offline):\n• **Sale**: "aaj ki sale", "is mahine ki sale", "profit"\n• **Stock**: "Panadol ka stock", "Panadol ka rate", "low stock", "expiry"\n• **Kaam**: "Panadol ki 2 strip cart me dalo", "backup lo", "naya bill"\n• **Navigation**: "inventory kholo", "reports kholo", "settings kholo"\n• **Info**: "kitni medicines hain", "version"\nAur software ke baare mein koi bhi sawal — jaise "loose goli kaise bechun".'};

  /* ---- version / status ---- */
  if(/\bversion\b/.test(t) || /kitni medicine|kitni dawai|total item|count\b/.test(t)){
    var stk=DB.batches.reduce(function(a,b){return a+num(b.qty)},0);
    var val=DB.batches.reduce(function(a,b){return a+num(b.qty)*num(b.cost)},0);
    return {text:'**PharmaTrace Pro v3** (offline)\nMedicines: '+DB.medicines.length+'  ·  Batches: '+DB.batches.length+'  ·  Total units: '+stk+
      '\nSales saved: '+DB.sales.length+'  ·  Purchases: '+DB.purchases.length+
      (can('fullInventory')?'\nStock value (cost): '+money0(val):'')+'\nData: isi PC ke browser storage mein, koi internet nahi.'};
  }

  /* ---- backup ---- */
  if(/\bbackup\b|\bbkp\b/.test(t) && !/kaise|how|restore|wapas/.test(t)){
    downloadBackup();
    return {text:'Backup download ho gaya — JSON file aap ke Downloads folder mein hai. Usay USB ya Drive par safe rakho.'};
  }

  /* ---- navigation ---- */
  var navMap=[['dashboard',/dashboard|home|main page/],['mysales',/my sales|meri sale|mere sale|history/],['sales',/sale|bill|pos|bech/],['inventory',/inventory|stock|medicine|dawai/],
    ['purchases',/purchase|kharid|supplier bill/],['parties',/parties|party|customer|supplier|dikandar/],
    ['reports',/report|hisab|summary/],['settings',/setting|backup|option/],['assistant',/assistant|chat/]];
  if(/\bkholo\b|\bkhol\b|\bopen\b|\bjao\b|\bchalo\b|\bopen karo\b/.test(t)){
    for(var i=0;i<navMap.length;i++){
      if(navMap[i][1].test(t)){ goPage(navMap[i][0]); return {text:'Theek hai — '+navMap[i][0]+' khol diya.'}; }
    }
    return {text:'Kaunsa page kholun? Inventory, New Sale, Purchases, Parties, Reports ya Settings.'};
  }
  if(/logout|log out|sign out|bahar niklo|account band/.test(t)){
    doLogout();
    return {text:'Logout ho gaya.'};
  }
  if(/mere sale|meri sale|my sales|apni sale|apni bikri/.test(t)){
    goPage('mysales');
    return {text:'Aap ki sales history khol di.'};
  }
  if(/naya bill|new bill|naya sale|new sale|bill banao|sale shuru/.test(t)){
    cart=[]; goPage('sales');
    return {text:'Naya bill tayyar hai — search se medicine add karo. Invoice number khud agla hai.'};
  }

  /* ---- add to cart ---- */
  if(/\bcart\b|\bbech do\b|\bbechdo\b|\bdal do\b|\bdaldo\b|\badd karo\b/.test(t)){
    var um=t.match(/(\d+)\s*(goli|tablet|tab|capsule|cap|strip|pati|dabbi|dibbi|box|pack|btl|bottle)/);
    var qty=um?+um[1]:1, isPack=um?/strip|pati|dabbi|dibbi|box|pack|btl|bottle/.test(um[2]):false;
    var nameText=t.replace(/(\d+)\s*(goli|tablet|tab|capsule|cap|strip|pati|dabbi|dibbi|box|pack|btl|bottle)/g,' ')
      .replace(/\b(cart|bill|me|mein|dal|dalo|add|karo|kar|do|bech|bechna|bechni|ka|ki|ko|ek|one|se|mein)\b/g,' ')
      .replace(/\s+/g,' ').trim();
    var found=findMeds(nameText,1);
    if(!found.length) return {text:'Ye medicine nahi mili. Poora naam likho, jaise "Panadol ki 2 strip cart me dalo".'};
    var m=found[0], ps=packSizeOf(m), units=isPack?qty*ps:qty;
    var have=cart.filter(function(c){return c.medId===m.id})[0];
    if(have) have.units=num(have.units)+units; else cart.push({medId:m.id,name:m.name,units:units});
    goPage('sales');
    return {text:'**'+m.name+'** — '+fmtQty(m,units)+' cart mein daal diya. Total ab '+money0(cartSubtotal())+'. Bill complete karna ho to "Complete sale" dabao.'};
  }

  /* ---- sales summaries ---- */
  if(/\bsale\b|\bsales\b|\bbikri\b|\bkamai\b|\bprofit\b|\bmunafa\b|\bnafa\b/.test(t)){
    var today=localDate(new Date()), month=today.slice(0,7);
    var wantMonth=/mahine|month|monthly/.test(t);
    var list=wantMonth? salesBetween(month+'-01',month+'-31') : salesBetween(today,today);
    var gross=list.reduce(function(a,s){return a+num(s.total)},0);
    var prof=list.reduce(function(a,s){return a+saleProfit(s)},0);
    var items=list.reduce(function(a,s){return a+s.items.reduce(function(x,i){return x+num(i.qty)},0)},0);
    var lbl=wantMonth?'Is mahine':'Aaj';
    if(!list.length) return {text:lbl+' ki koi sale nahi hui abhi.'};
    return {text:'**'+lbl+' ki sale**\nInvoices: '+list.length+'\nTotal: **'+money0(gross)+'**'+
      (can('reports')?'\nProfit (after tax): '+money0(prof):'')+'\nItems sold: '+items+' units'};
  }

  /* ---- low stock ---- */
  if(/low stock|stock kam|kam stock|reorder|khatam|out of stock/.test(t)){
    var low=DB.medicines.map(function(m){
      var st=stockOf(m.id), re=num(m.reorderLevel);
      return {m:m,st:st,re:re};
    }).filter(function(x){ return x.st<=0 || (x.re>0 && x.st<=x.re) })
      .sort(function(a,b){ return (a.st-(a.re||0)) - (b.st-(b.re||0)) });
    if(!low.length) return {text:'Zabardast — koi medicine low stock mein nahi hai.'};
    var txt='**Low stock ('+low.length+')**\n'+low.slice(0,8).map(function(x){
      return '• '+x.m.name+': '+(x.st<=0?'khatam':'sirf '+fmtQty(x.m,x.st))+(x.re>0?' (min '+fmtQty(x.m,x.re)+')':'');
    }).join('\n');
    if(low.length>8) txt+='\n… aur '+(low.length-8)+' mazeed.';
    return {text:txt};
  }

  /* ---- expiry ---- */
  if(/expiry|expire|kharab|expiring/.test(t)){
    var wd=num(DB.settings.expiryWarnDays)||90;
    var ex=DB.batches.filter(function(b){ var d=expiryInfo(b.expiry).days; return num(b.qty)>0 && d!==null && d<=wd })
      .sort(function(a,b){return String(a.expiry).localeCompare(String(b.expiry))});
    if(!ex.length) return {text:'Agle '+wd+' din mein koi batch expire nahi ho rahi.'};
    var tx='**Expiry alert ('+wd+' din ke andar)**\n'+ex.slice(0,8).map(function(b){
      var m=medById(b.medId)||{unit:'unit'};
      return '• '+(m.name||'(deleted)')+' · '+monthLabel(b.expiry)+' · '+fmtQty(m,num(b.qty));
    }).join('\n');
    return {text:tx};
  }

  /* ---- stock / rate of a medicine ---- */
  var med=findMeds(raw,3);
  if(med.length){
    if(med.length>1 && /\b(stock|rate|price|kitni|kitna)\b/.test(t)){
      var best=med[0];
      return {text:medLine(best)};
    }
    return {text:medLine(med[0])};
  }

  /* ---- knowledge base ---- */
  var bestE=null,bestS=0;
  KB.forEach(function(e){
    var hay=norm(e.q+' '+e.k.join(' '));
    var s=0;
    T.forEach(function(x){
      if(e.k.indexOf(x)>=0) s+=3;
      else if(hay.indexOf(x)>=0) s+=(x.length>3?2:1);
    });
    if(s>bestS){ bestS=s; bestE=e; }
  });
  if(bestE && bestS>=3) return {text:bestE.a};

  return {text:'Ye main theek se samajh nahi paya. Aise pooch kar dekho:\n'+ASK_SUGGEST.slice(0,5).map(function(x){return '• '+x}).join('\n')};
}

function marginRows(){
  return DB.medicines.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name))}).map(function(m){
    var bs=DB.batches.filter(function(b){return b.medId===m.id && num(b.cost)>0});
    var actual=bs.length? num(bs[bs.length-1].cost) : (num(m.cost)>0? num(m.cost) : null);
    var price=num(m.price);
    var real=(actual!==null && price>0) ? Math.round((price-actual)/price*1000)/10 : null;
    return {m:m, price:price, margin:medMargin(m), cost:medCost(m), profit:medProfit(m), actual:actual, real:real};
  });
}

  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});

  var uc=$('#userchip');
  if(uc){
    uc.innerHTML='<div class="who"><b>'+esc(u.name)+'</b><span>'+esc(roleLabel(u.role))+'</span></div>'+
      '<button class="btn ghost sm" id="btn-logout">Logout</button>';
    var lo=$('#btn-logout'); if(lo) lo.onclick=function(){ doLogout() };
  }
  $$('#nav button').forEach(function(b){
    var r=b.getAttribute('data-route');
    b.style.display = routeAllowed(r) ? '' : 'none';
    b.classList.toggle('active', r===route);
  });
  if(!routeAllowed(route)) route = (u.role==='sales') ? 'sales' : 'dashboard';
  var v=VIEWS[route]||VIEWS.dashboard;
  $('#app').innerHTML=v.html();
  if(v.bind) v.bind();
  window.scrollTo(0,0);
}

/* global clicks: nav + shared actions */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-route]');
  if(t){ route=t.getAttribute('data-route'); render(); return; }
  var a=e.target.closest('[data-act]');
  if(a){
    var act=a.getAttribute('data-act');
    if(act==='add-med'){ if(!can('fullInventory')){ toast('Sirf main admin medicine add kar sakta hai','err'); return; } medForm(null); }
    if(act==='add-stock'){ if(!can('stockIn')){ toast('Ijazat nahi','err'); return; } stockInForm(a.getAttribute('data-med')); }
    if(act==='demo'){ if(!can('fullInventory')){ toast('Ijazat nahi','err'); return; } seedDemo(); render(); toast('Demo data loaded','ok'); }
    return;
  }
  var ed=e.target.closest('[data-edit]');
  if(ed){ if(!can('fullInventory')){ toast('Sirf main admin','err'); return; } medForm(medById(ed.getAttribute('data-edit'))); return; }
  var dm=e.target.closest('[data-delmed]');
  if(dm){
    if(!can('fullInventory')){ toast('Sirf main admin delete kar sakta hai','err'); return; }
    var id=dm.getAttribute('data-delmed'), m=medById(id);
    if(!m) return;
    if(!confirm('Delete '+m.name+' and all its batches? Past sales stay in the history.')) return;
    DB.medicines=DB.medicines.filter(function(x){return x.id!==id});
    DB.batches=DB.batches.filter(function(b){return b.medId!==id});
    persist(); render(); toast('Medicine deleted');
    return;
  }
  var bt=e.target.closest('[data-batches]');
  if(bt){ batchesModal(bt.getAttribute('data-batches')); return; }
  var rc=e.target.closest('[data-receipt]');
  if(rc){ showReceipt(rc.getAttribute('data-receipt'),false); return; }
});

/* keyboard: escape closes modal, alt+number switches view */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeModal();
});

/* boot */
render();
</script>
</body>
</html>
